  <text x="72" y="293" font-family="Arial, sans-serif" font-size="13" fill="#7888A8">Адаптив + кроссбраузерность</text>

  <rect x="40" y="309" width="22" height="22" rx="6" fill="#0A1020" stroke="#182035" stroke-width="1"/>
