  <text x="70" y="60" font-family="Arial, sans-serif" font-size="11" fill="#4A6088" letter-spacing="1.5">РАЗРАБОТКА САЙТОВ</text>

  <!-- headline -->
  <text x="40" y="138" font-family="'Arial Black', Impact, 'Helvetica Neue', sans-serif" font-size="68" font-weight="900" fill="#F0F0F8" letter-spacing="-2">ЛЕНДИНГ</text>
  <text x="40" y="208" font-family="'Arial Black', Impact, 'Helvetica Neue', sans-serif" font-size="68" font-weight="900" letter-spacing="-2" fill="url(#accent)" filter="url(#glow-text)">ПОД КЛЮЧ</text>

  <!-- underline accent -->
