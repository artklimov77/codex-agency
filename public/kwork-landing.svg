<svg width="690" height="518" viewBox="0 0 690 518" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0C1428"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="green-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="#050810" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="0.7" fill="#3B7DEB" opacity="0.13"/>
    </pattern>
    <filter id="glow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="bclip">
      <rect x="334" y="33" width="324" height="454" rx="13"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="690" height="518" fill="url(#bg)"/>
  <rect width="690" height="518" fill="url(#dots)"/>
  <!-- left glow blob -->
  <ellipse cx="155" cy="260" rx="210" ry="170" fill="#2563EB" opacity="0.07"/>

