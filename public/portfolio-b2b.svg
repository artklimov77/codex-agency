<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="b-blur-xl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="75"/>
    </filter>
    <filter id="b-blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="b-blur-md" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="b-overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#030408" stop-opacity="1"/>
      <stop offset="40%" stop-color="#030408" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#030408" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="b-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#030408" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="b-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#030408" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="b-nav-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#030408" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BG — tech/data center look -->
  <rect width="1440" height="900" fill="#030408"/>

  <ellipse cx="1100" cy="420" rx="650" ry="520" fill="#060A18" filter="url(#b-blur-xl)"/>
  <ellipse cx="1200" cy="220" rx="380" ry="260" fill="#0A1440" filter="url(#b-blur-lg)" opacity="0.95"/>
  <ellipse cx="950"  cy="600" rx="300" ry="280" fill="#060C30" filter="url(#b-blur-lg)" opacity="0.75"/>
  <ellipse cx="1350" cy="400" rx="200" ry="350" fill="#08102A" filter="url(#b-blur-lg)" opacity="0.6"/>
  <ellipse cx="1100" cy="500" rx="250" ry="200" fill="#0C1848" filter="url(#b-blur-md)" opacity="0.4"/>
  <!-- Blue accent glow -->
  <ellipse cx="1050" cy="300" rx="200" ry="150" fill="#1535A0" filter="url(#b-blur-lg)" opacity="0.25"/>
  <ellipse cx="1300" cy="150" rx="160" ry="120" fill="#2050C0" filter="url(#b-blur-lg)" opacity="0.18"/>

  <!-- Overlay -->
  <rect width="1440" height="900" fill="url(#b-overlay)"/>
  <rect width="1440" height="100" fill="url(#b-top)" opacity="0.55"/>
  <rect x="0" y="760" width="1440" height="140" fill="url(#b-bottom)"/>

  <!-- NAV -->
  <rect width="1440" height="80" fill="url(#b-nav-bg)"/>
  <!-- Logo mark — small square grid -->
  <rect x="72"  y="22" width="12" height="12" fill="url(#b-blue)"/>
  <rect x="86"  y="22" width="12" height="12" fill="url(#b-blue)" opacity="0.6"/>
  <rect x="72"  y="36" width="12" height="12" fill="url(#b-blue)" opacity="0.6"/>
  <rect x="86"  y="36" width="12" height="12" fill="url(#b-blue)" opacity="0.3"/>
  <text x="108" y="38" font-family="'Arial',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="3">NEXUS</text>
  <text x="108" y="55" font-family="Arial,sans-serif" font-size="8" fill="#3A4A70" letter-spacing="4">КОРПОРАТИВНЫЕ РЕШЕНИЯ</text>

  <text x="490" y="44" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="1.5">Решения</text>
  <text x="590" y="44" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="1.5">Отрасли</text>
  <text x="695" y="44" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="1.5">Клиенты</text>
  <text x="800" y="44" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="1.5">Технологии</text>
  <text x="930" y="44" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="1.5">Контакты</text>

  <rect x="1236" y="22" width="180" height="38" rx="2" fill="url(#b-blue)"/>
  <text x="1326" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" letter-spacing="2">ПОЛУЧИТЬ ДЕМО</text>

  <line x1="0" y1="80" x2="1440" y2="80" stroke="#2563EB" stroke-width="0.4" opacity="0.25"/>

  <!-- HERO -->
  <line x1="72" y1="170" x2="108" y2="170" stroke="#2563EB" stroke-width="1.5" opacity="0.7"/>
  <text x="120" y="175" font-family="Arial,sans-serif" font-size="10" fill="#4A70D8" letter-spacing="4">АВТОМАТИЗАЦИЯ · CRM · ERP</text>

  <text x="72" y="278" font-family="Arial,sans-serif" font-size="90" font-weight="bold" fill="#E8ECFA" letter-spacing="-3">Цифровой</text>
  <text x="72" y="378" font-family="Arial,sans-serif" font-size="90" font-weight="bold" fill="#E8ECFA" letter-spacing="-3">контроль</text>
  <text x="72" y="478" font-family="Arial,sans-serif" font-size="90" font-weight="bold" fill="url(#b-blue)" letter-spacing="-3">бизнеса</text>

  <text x="72" y="524" font-family="Arial,sans-serif" font-size="14" fill="#4A5880" letter-spacing="2">CRM-системы  ·  Аналитика  ·  Интеграции  ·  Автоматизация</text>

  <line x1="72" y1="546" x2="430" y2="546" stroke="#2563EB" stroke-width="0.5" opacity="0.35"/>

  <!-- CTAs -->
  <rect x="72"  y="566" width="230" height="54" rx="2" fill="url(#b-blue)"/>
  <text x="187" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="2">ЗАПРОСИТЬ ДЕМО</text>

  <rect x="318" y="566" width="200" height="54" rx="2" fill="none" stroke="#2A3A70" stroke-width="1"/>
  <text x="418" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#7A90C0" letter-spacing="2">КЕЙСЫ КЛИЕНТОВ</text>

  <!-- Client logos row -->
  <text x="72" y="660" font-family="Arial,sans-serif" font-size="9" fill="#2A3A60" letter-spacing="3">НАМ ДОВЕРЯЮТ</text>
  <line x1="72" y1="668" x2="500" y2="668" stroke="#1A2A50" stroke-width="0.5"/>

  <!-- Fake logos as styled text -->
  <rect x="72"  y="676" width="82" height="28" rx="2" fill="#090C18" stroke="#1A2A50" stroke-width="1"/>
  <text x="113" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3A5090" letter-spacing="1">РОСБАНК</text>

  <rect x="166" y="676" width="82" height="28" rx="2" fill="#090C18" stroke="#1A2A50" stroke-width="1"/>
  <text x="207" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3A5090" letter-spacing="1">ЛОГИСТИК</text>

  <rect x="260" y="676" width="82" height="28" rx="2" fill="#090C18" stroke="#1A2A50" stroke-width="1"/>
  <text x="301" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3A5090" letter-spacing="1">МЕДГРУПП</text>

  <rect x="354" y="676" width="82" height="28" rx="2" fill="#090C18" stroke="#1A2A50" stroke-width="1"/>
  <text x="395" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3A5090" letter-spacing="1">ТЕХСЕТЬ</text>

  <!-- Metrics -->
  <text x="72"  y="752" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#E8ECFA">200+</text>
  <text x="72"  y="772" font-family="Arial,sans-serif" font-size="10" fill="#2A3A70" letter-spacing="2">КОМПАНИЙ</text>

  <line x1="210" y1="740" x2="210" y2="782" stroke="#1A2A50" stroke-width="1"/>
  <text x="228" y="752" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#E8ECFA">40%</text>
  <text x="228" y="772" font-family="Arial,sans-serif" font-size="10" fill="#2A3A70" letter-spacing="2">РОСТ ВЫРУЧКИ</text>

  <line x1="360" y1="740" x2="360" y2="782" stroke="#1A2A50" stroke-width="1"/>
  <text x="378" y="752" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#E8ECFA">8 лет</text>
  <text x="378" y="772" font-family="Arial,sans-serif" font-size="10" fill="#2A3A70" letter-spacing="2">ОПЫТА</text>

  <!-- Corner brackets -->
  <line x1="1340" y1="100" x2="1420" y2="100" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <line x1="1420" y1="100" x2="1420" y2="180" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <line x1="1340" y1="800" x2="1420" y2="800" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <line x1="1420" y1="800" x2="1420" y2="720" stroke="#2563EB" stroke-width="1" opacity="0.2"/>

  <!-- Bottom strip -->
  <line x1="0" y1="820" x2="1440" y2="820" stroke="#2563EB" stroke-width="0.5" opacity="0.2"/>
  <text x="240"  y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#4A70D8" letter-spacing="3">CRM-СИСТЕМЫ</text>
  <text x="240"  y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2A3A60" letter-spacing="2">УПРАВЛЕНИЕ КЛИЕНТАМИ</text>
  <line x1="480" y1="828" x2="480" y2="888" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <text x="720"  y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#4A70D8" letter-spacing="3">АНАЛИТИКА</text>
  <text x="720"  y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2A3A60" letter-spacing="2">ДАШБОРДЫ И ОТЧЁТЫ</text>
  <line x1="960" y1="828" x2="960" y2="888" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <text x="1200" y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#4A70D8" letter-spacing="3">ИНТЕГРАЦИИ</text>
  <text x="1200" y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2A3A60" letter-spacing="2">1С · БИТРИКС · TELEGRAM</text>
</svg>
